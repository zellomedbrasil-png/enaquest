<h2>Confirme seu e-mail no EnaQuest</h2>
<p>Falta só um passo para começar seu plantão. Toque no botão abaixo para confirmar seu e-mail:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app/boas-vindas" style="display:inline-block;padding:12px 20px;background:#0f766e;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600">Confirmar meu e-mail</a></p>
<p>O link vale por 1 hora e funciona em qualquer aparelho.</p>
<p>Se você não criou uma conta no EnaQuest, pode ignorar este e-mail.</p>
