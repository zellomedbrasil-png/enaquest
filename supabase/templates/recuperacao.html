<h2>Crie uma nova senha no EnaQuest</h2>
<p>Recebemos um pedido para trocar a senha da sua conta. Toque no botão abaixo para criar uma nova:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nova-senha" style="display:inline-block;padding:12px 20px;background:#0f766e;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600">Criar nova senha</a></p>
<p>O link vale por 1 hora e funciona em qualquer aparelho.</p>
<p>Se não foi você, ignore este e-mail: sua senha continua a mesma.</p>
